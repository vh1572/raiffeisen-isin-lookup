<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BRC scanner — Raiffeisen</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="header">
        <div>
          <p class="eyebrow">Structured products</p>
          <h1>BRC scanner</h1>
          <p class="subtitle">
            Scans <strong>barrier reverse convertibles</strong> on the
            <a href="https://structuredproducts.raiffeisen.ch/website-api/" target="_blank" rel="noreferrer">Raiffeisen website API</a>
            and lists products with maturity in the next month, no barrier hit, and bid around 80–90% of nominal.
            <a href="/" class="nav-link">← ISIN lookup</a>
          </p>
        </div>
      </header>

      <section class="panel controls-panel">
        <div class="filter-row">
          <label>
            Maturity within (days)
            <input type="number" id="maturity-days" min="1" max="180" value="31" />
          </label>
          <label>
            Bid min (%)
            <input type="number" id="bid-min" min="0" max="200" step="0.5" value="80" />
          </label>
          <label>
            Bid max (%)
            <input type="number" id="bid-max" min="0" max="200" step="0.5" value="90" />
          </label>
        </div>
        <div class="actions">
          <button type="button" id="scan-btn" class="btn primary">Scan BRC universe</button>
        </div>
        <p id="status" class="status" aria-live="polite"></p>
      </section>

      <section class="panel results-panel hidden" id="results-panel">
        <div class="results-header">
          <h2>Matches</h2>
          <p id="summary" class="summary"></p>
        </div>
        <div class="table-wrap">
          <table id="results-table">
            <thead>
              <tr id="results-header-row"></tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
        </div>
      </section>
    </div>
    <script src="/brc.js" type="module"></script>
  </body>
</html>
